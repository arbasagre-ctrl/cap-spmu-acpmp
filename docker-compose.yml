services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - application_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - application_storage:/var/www/html/storage

  queue:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--tries=1", "--sleep=3", "--timeout=30"]
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - application_storage:/var/www/html/storage

volumes:
  database_data:
  application_storage:
